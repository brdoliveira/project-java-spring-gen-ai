spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/local-data.sql

management:
  tracing:
    sampling:
      probability: 0.1
